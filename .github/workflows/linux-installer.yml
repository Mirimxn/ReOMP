# Builds the ReOMP Mod Manager Linux release ZIP (AppImage + install script).
# See plans/installer.md#linux.
#
# - Every push to main and every pull request: builds the ZIP, test-installs it
#   into a temporary data folder and attaches it to the run.
# - Pushing a tag such as v0.5.0: also publishes it on the Releases page.
name: Linux installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          version=$(jq -r .version apps/mod-manager/src-tauri/tauri.conf.json)
          [[ -n "$version" && "$version" != null ]] || { echo "No version in tauri.conf.json"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v$version"; exit 1
          fi

      - name: Check the install script
        run: bash -n installers/linux/install-reomp.sh

      - name: Build the AppImage
        run: |
          docker build --platform linux/amd64 -f installers/linux/Dockerfile -t reomp-linux-builder apps/mod-manager
          id=$(docker create reomp-linux-builder)
          mkdir -p staging
          docker cp "$id:/out/ReOMP.AppImage" staging/ReOMP.AppImage
          docker rm "$id"
          cp installers/linux/install-reomp.sh staging/

      - name: Test install, upgrade and uninstall
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/data with space %"
          bash staging/install-reomp.sh
          test -x "$XDG_DATA_HOME/reomp/app/current/AppRun"
          grep -q '^Exec=".*/reomp/app/current/AppRun"$' "$XDG_DATA_HOME/applications/com.reomp.manager.desktop"
          bash staging/install-reomp.sh
          test "$(ls -d "$XDG_DATA_HOME"/reomp/app/release-* | wc -l)" -eq 1
          bash staging/install-reomp.sh --uninstall
          test ! -e "$XDG_DATA_HOME/reomp/app"
          test ! -e "$XDG_DATA_HOME/applications/com.reomp.manager.desktop"

      - name: Package the ZIP
        run: |
          name="ReOMP-${{ steps.version.outputs.version }}-linux-x64"
          mkdir -p out
          (cd staging && zip -X "../out/$name.zip" ReOMP.AppImage install-reomp.sh)
          unzip -l "out/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ReOMP-${{ steps.version.outputs.version }}-linux-x64
          path: out/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ReOMP-${{ needs.build.outputs.version }}-linux-x64
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          name: ReOMP ${{ github.ref_name }}
          files: out/*.zip
          fail_on_unmatched_files: true
